<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devil tiles</title>
<style>
  :root { --bg: #f6f3ef; --ink: #2a1a18; --btn: #ffffffcc; box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1d1414; --ink: #f3e6e2; --btn: #2a1d1dcc; } }
  :root[data-theme="dark"] { --bg: #1d1414; --ink: #f3e6e2; --btn: #2a1d1dcc; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  .controls { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 8px; align-items: center; }
  button, select { font: inherit; font-size: 14px; color: var(--ink); background: var(--btn);
    border: 1px solid color-mix(in srgb, var(--ink) 25%, transparent); border-radius: 8px; padding: 6px 12px; cursor: pointer;
    backdrop-filter: blur(6px); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="controls">
  <label><select id="scale" aria-label="Tile size">
    <option value="1">1x</option><option value="2" selected>2x</option><option value="3">3x</option>
  </select></label>
  <button id="replay">Replay</button>
</div>

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scaleSel = document.getElementById('scale');
const img = new Image();
let raf = 0, idx = 0, cols = 0, rows = 0, tw = 0, th = 0, perFrame = 1;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DURATION_S = 8;

function setup() {
  cancelAnimationFrame(raf);
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, w, h);
  const s = Number(scaleSel.value);
  tw = img.naturalWidth * s; th = img.naturalHeight * s;
  cols = Math.ceil(w / tw); rows = Math.ceil(h / th);
  idx = 0;
  const total = cols * rows;
  perFrame = reduce ? total : Math.max(1, Math.ceil(total / (DURATION_S * 60)));
  raf = requestAnimationFrame(step);
}

function step() {
  const total = cols * rows;
  for (let n = 0; n < perFrame && idx < total; n++, idx++) {
    const r = Math.floor(idx / cols), c = idx % cols;
    ctx.drawImage(img, c * tw, r * th, tw, th);
  }
  if (idx < total) raf = requestAnimationFrame(step);
}

img.onload = setup;
img.src = SRC;
document.getElementById('replay').addEventListener('click', setup);
scaleSel.addEventListener('change', setup);
let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(setup, 150); });
</script>
