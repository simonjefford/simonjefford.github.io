  idx = 0;
  const total = cols * rows;
  perFrame = reduce ? total : Math.max(1, Math.ceil(total / (DURATION_S * 60)));
  raf = requestAnimationFrame(step);
}

function step() {
  const total = cols * rows;
  for (let n = 0; n < perFrame && idx < total; n++, idx++) {
    const r = Math.floor(idx / cols), c = idx % cols;
    const pick = Math.floor(Math.random() * imgs.length);
    // keep the pixel-art devil crisp, smooth the photos
    ctx.imageSmoothingEnabled = pick !== 0;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(imgs[pick], c * tw, r * th, tw, th);
  }
  if (idx < total) raf = requestAnimationFrame(step);
}

Promise.all(SOURCES.map(src => new Promise(res => {
  const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src;
}))).then(list => { imgs = list.filter(Boolean); setup(); });

document.getElementById('replay').addEventListener('click', setup);
scaleSel.addEventListener('change', setup);
let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => imgs.length && setup(), 150); });
</script>
</body>
